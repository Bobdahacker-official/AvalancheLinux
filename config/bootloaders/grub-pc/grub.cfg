set default=0
set timeout=8
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
menuentry 'Start AvalancheLinux 1.0 Summit' {
  linux /live/vmlinuz boot=live components username=avalanche user-fullname=AvalancheLinux hostname=avalanche locales=en_US.UTF-8 keyboard-layouts=us
  initrd /live/initrd.img
}
menuentry 'AvalancheLinux (safe graphics)' {
  linux /live/vmlinuz boot=live components username=avalanche user-fullname=AvalancheLinux hostname=avalanche nomodeset
  initrd /live/initrd.img
}
if [ "${grub_platform}" = "efi" ]; then
  menuentry 'Firmware settings' { fwsetup; }
fi
