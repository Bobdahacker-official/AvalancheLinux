---
modules-search: [local]
branding: avalanche
oem-setup: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
prompt-install: true
sequence:
  - show: [welcome, locale, keyboard, partition, users, summary]
  - exec:
      - partition
      - mount
      - unpackfs
      - removeuser
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - shellprocess
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show: [finished]
