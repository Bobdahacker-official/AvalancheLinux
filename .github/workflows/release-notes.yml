name: Update release notes
on:
  push:
    paths:
      - docs/releases/v1.0.0.md
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --notes-file docs/releases/v1.0.0.md
